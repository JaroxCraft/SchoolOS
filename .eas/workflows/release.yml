name: Release

# Start a release by publishing a GitHub release with a new tag (v1.2.3) and the text for the
# testers, without "Set as the latest release": publishing creates the tag, which runs this
# workflow. The text becomes "What to Test" on TestFlight, and the Android APK is attached to the
# release as SchoolOS.apk. Only then the release becomes the latest one, so
# schoolos.jarox.dev/apk (the SchoolOS.apk of the latest release) keeps working during the build.

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release_notes:
    name: Read the release notes
    outputs:
      notes: ${{ steps.read.outputs.notes }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - id: read
        run: |
          # With the token when there is one: unauthenticated calls share a small rate limit
          AUTH=()
          [ -n "$GITHUB_RELEASE_TOKEN" ] && AUTH=(-H "Authorization: Bearer $GITHUB_RELEASE_TOKEN")
          URL="https://api.github.com/repos/JaroxCraft/SchoolOS/releases/tags/$TAG"
          NOTES=$(curl -fsSL "${AUTH[@]}" "$URL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write((JSON.parse(s).body||"").trim()))') || NOTES=""
          if [ -z "$NOTES" ]; then
            echo "No GitHub release with text for $TAG: publish the release on GitHub with the notes for the testers, which creates the tag."
            exit 1
          fi
          printf '%s\n' "$NOTES"
          set-output notes "$NOTES"

  build_ios:
    name: Build iOS
    needs: [release_notes]
    type: build
    env:
      APP_VERSION: ${{ github.ref_name }}
    params:
      platform: ios
      profile: production
      message: ${{ github.ref_name }}

  testflight_ios:
    name: Submit to TestFlight
    needs: [build_ios, release_notes]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: ${{ needs.release_notes.outputs.notes }}

  build_android:
    name: Build Android APK
    needs: [release_notes]
    type: build
    env:
      APP_VERSION: ${{ github.ref_name }}
    params:
      platform: android
      profile: preview
      message: ${{ github.ref_name }}

  publish_apk:
    name: Attach the APK to the GitHub release
    needs: [build_android]
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - id: download
        uses: eas/download_build
        with:
          build_id: ${{ needs.build_android.outputs.build_id }}
          extensions: [apk]
      - name: Upload SchoolOS.apk
        run: |
          # GITHUB_RELEASE_TOKEN: Expo environment variable (production, secret), a fine-grained
          # GitHub token with "Contents: Read and write" on JaroxCraft/SchoolOS
          if [ -z "$GITHUB_RELEASE_TOKEN" ]; then
            echo "GITHUB_RELEASE_TOKEN is missing in the production environment of Expo"
            exit 1
          fi
          API="https://api.github.com/repos/JaroxCraft/SchoolOS"
          AUTH="Authorization: Bearer $GITHUB_RELEASE_TOKEN"
          # Reads stdin as JSON and prints the expression $1 of it (`j`)
          json() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String($1))})"; }
          rename() { curl -fsSL -X PATCH -H "$AUTH" -H "Content-Type: application/json" -d "{\"name\":\"$2\"}" "$API/releases/assets/$1" > /dev/null; }
          remove() { curl -fsSL -X DELETE -H "$AUTH" "$API/releases/assets/$1"; }
          RELEASE=$(curl -fsSL -H "$AUTH" "$API/releases/tags/$TAG")
          RELEASE_ID=$(printf '%s' "$RELEASE" | json 'j.id')
          asset() { printf '%s' "$RELEASE" | json "(j.assets.find(a=>a.name==='$1')||{}).id||''"; }

          # A rerun replaces the APK of the release: the new one is uploaded under a temporary
          # name first, so SchoolOS.apk stays downloadable if the upload fails
          OLD=$(asset SchoolOS.apk)
          for LEFTOVER in $(asset SchoolOS.new.apk) $([ -n "$OLD" ] && asset SchoolOS.old.apk); do
            remove "$LEFTOVER"
          done
          NEW=$(curl -fsSL -X POST -H "$AUTH" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"${{ steps.download.outputs.artifact_path }}" \
            "https://uploads.github.com/repos/JaroxCraft/SchoolOS/releases/$RELEASE_ID/assets?name=SchoolOS.new.apk" | json 'j.id') || NEW=""
          if [ -z "$NEW" ]; then
            echo "Uploading the APK failed; the release keeps its previous SchoolOS.apk, if any"
            exit 1
          fi
          [ -n "$OLD" ] && rename "$OLD" SchoolOS.old.apk
          if ! rename "$NEW" SchoolOS.apk; then
            # Give the old APK its name back
            [ -n "$OLD" ] && rename "$OLD" SchoolOS.apk
            remove "$NEW"
            echo "Could not name the new APK SchoolOS.apk"
            exit 1
          fi
          if [ -n "$OLD" ] && ! remove "$OLD"; then
            echo "The previous APK is left as SchoolOS.old.apk"
          fi
          # Only now /apk may point to this release, and only if no newer release is the latest
          # (a rerun of an older tag, or two releases whose builds finish out of order)
          LATEST=$(curl -fsSL -H "$AUTH" "$API/releases/latest" | json 'j.tag_name') || LATEST=""
          NEWER=$(node -e 'const v=t=>t.replace(/^v/,"").split(".").map(Number);const [a,b]=[v(process.argv[1]),v(process.argv[2]||"v0.0.0")];const d=b[0]-a[0]||b[1]-a[1]||b[2]-a[2];process.stdout.write(d>0?"yes":"")' "$TAG" "$LATEST")
          if [ -n "$NEWER" ]; then
            echo "Attached SchoolOS.apk to $TAG; $LATEST stays the latest release"
            exit 0
          fi
          curl -fsSL -X PATCH -H "$AUTH" -H "Content-Type: application/json" -d '{"make_latest":"true"}' "$API/releases/$RELEASE_ID" > /dev/null
          echo "Attached SchoolOS.apk to $TAG and made it the latest release"
