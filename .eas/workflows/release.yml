name: Release

on:
  push:
    tags: ['v*']

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
      message: ${{ github.ref_name }}

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  build_android:
    name: Build Android APK
    type: build
    params:
      platform: android
      profile: preview
      message: ${{ github.ref_name }}
